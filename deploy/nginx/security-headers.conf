# Same frontend policy as frontend/dist/security-headers.json; verified in offline tests.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy 'camera=(), geolocation=(), payment=(), microphone=(self), on-device-speech-recognition=(self)' always;
# Voice build flag stays false; permission policy does not enable the feature.
add_header Strict-Transport-Security 'max-age=31536000' always;
add_header Cache-Control no-store always;
