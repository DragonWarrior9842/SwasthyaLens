# Included only in the HTTPS /api/ location; strip the prefix via the trailing slash.
proxy_pass http://127.0.0.1:8000/;
proxy_http_version 1.1;
proxy_set_header Connection '';
proxy_pass_request_headers off;
proxy_set_header Host STAGING_HOSTNAME;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header Cookie $http_cookie;
proxy_set_header Origin $http_origin;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
# No Authorization/Forwarded/X-Forwarded-*/caller request IDs are trusted or forwarded.
# Backend peer is loopback; the gateway independently limits the actual TCP peer.
proxy_connect_timeout 5s;
proxy_send_timeout 65s;
proxy_read_timeout 130s;
proxy_next_upstream off;
proxy_request_buffering off;
proxy_buffering off;
proxy_max_temp_file_size 0;
proxy_cache off;
proxy_hide_header X-Powered-By;
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Cache-Control;
# Explicit location headers avoid Nginx's add_header inheritance trap, including errors.
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=()' always;
add_header Strict-Transport-Security 'max-age=31536000' always;
add_header Cache-Control no-store always;
