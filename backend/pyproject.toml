[project]
name = "swasthyalens-api"
version = "0.1.0"
description = "Local API foundation for SwasthyaLens."
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.14.0",
    "email-validator==2.3.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "tzdata==2026.4",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
    "uv==0.12.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
